<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Live Class Poll{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block header %}
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ url_for('home') }}" class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">Live Class Poll</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('teacher') }}" {% if request.endpoint == 'teacher' %}class="active"{% endif %}>Teacher</a>
        <a href="{{ url_for('projector') }}" {% if request.endpoint == 'projector' %}class="active"{% endif %}>Projector</a>
        <a href="{{ url_for('vote') }}" {% if request.endpoint == 'vote' %}class="active"{% endif %}>Vote</a>
      </nav>
    </div>
  </header>
  {% endblock %}

  <main class="{% block main_class %}container{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
